arger firm took over the company last year. (Một công ty lớn hơn đã tiếp quản công ty đó năm ngoái.) | He took over from the former manager.(Tiếp quản từ ai hoặc thay thế cái gì)","st":0,"d":"2026-11-24"},{"id":"b012","t":"WORK","p":"turn down","m":"reject, decline, refuse: từ chối (lời đề nghị, yêu cầu)","s":"He turned down the job offer because the salary was too low. (Anh ấy từ chối lời mời làm việc vì lương quá thấp.)","st":0,"d":"2026-11-24"},{"id":"b013","t":"GOVERNMENT","p":"charity","m":"tổ chức từ thiện, phi lợi nhuận","s":"She works for a children's charity. (Cô ấy làm cho một tổ chức từ thiện trẻ em.)","st":0,"d":"2026-11-24"},{"id":"b014","t":"WORK","p":"pension","m":"lương hưu","s":"She lives on a small pension. (Bà sống bằng khoản lương hưu nhỏ.)","st":0,"d":"2026-11-24"},{"id":"b015","t":"WORK","p":"resign/quit","m":"xin nghỉ việc/từ chức","s":"She resigned after an argument with her boss. (Cô ấy xin nghỉ sau khi cãi nhau với sếp.)","st":0,"d":"2026-11-24"},{"id":"b016","t":"BUSINESS","p":"wage","m":"income: tiền công (lao động chân tay)","s":"Factory workers receive weekly wages. (Công nhân nhà máy nhận lương theo tuần.)","st":0,"d":"2026-11-24"},{"id":"b017","t":"BUSINESS","p":"Stiff competition","m":"cạnh tranh gay gắt","s":"Local businesses face stiff competition from online retailers. (Doanh nghiệp địa phương đối mặt với cạnh tranh gay gắt từ các nhà bán lẻ trực tuyến.)","st":0,"d":"2026-11-24"},{"id":"b018","t":"BUSINESS","p":"recession","m":"suy thoái kinh tế","s":"Governments often cut taxes in an attempt to end a recession. (Chính phủ thường giảm thuế để cố gắng chấm dứt suy thoái.)","st":0,"d":"2026-11-24"},{"id":"b019","t":"BUSINESS","p":"sell like hot cakes","m":"bán chạy như tôm tươi","s":"The jackets are selling like hotcakes, so they might sell out soon. (Những chiếc áo khoác đang bán rất chạy nên có thể sẽ sớm hết hàng.)","st":0,"d":"2026-11-24"},{"id":"b020","t":"BUSINESS","p":"sell out","m":"be out of stock: bán hết sạch","s":"The concert sold out in ten minutes (Buổi hòa nhạc bán hết vé trong mười phút).","st":0,"d":"2026-11-24"},{"id":"b021","t":"BUSINESS","p":"Custom-built","m":"customized, custom-made: làm riêng theo yêu cầu khách","s":"He ordered a custom-built gaming PC with a powerful graphics card. (Anh ấy đặt làm riêng một chiếc PC chơi game có card đồ họa mạnh.)","st":0,"d":"2026-11-24"},{"id":"b022","t":"BUSINESS","p":"roll out","m":"launch, introduce, implement, deploy: triển khai dần trên diện rộng","s":"The bank will roll out the new app in stages across the country. (Ngân hàng sẽ triển khai ứng dụng mới theo từng giai đoạn trên toàn quốc.)","st":0,"d":"2026-11-24"},{"id":"b023","t":"BUSINESS","p":"going forward","m":"moving forward, from now on: Từ nay về sau","s":"Going forward, we'll put more effort into online marketing. (Từ nay về sau, chúng tôi sẽ đầu tư nhiều công sức hơn cho tiếp thị trực tuyến.)","st":0,"d":"2026-11-24"},{"id":"b024","t":"BUSINESS","p":"access new markets","m":"enter a market: tiếp cận thị trường mới","s":"Online platforms help small firms access new markets overseas. (Các nền tảng trực tuyến giúp công ty nhỏ tiếp cận thị trường mới ở nước ngoài.)","st":0,"d":"2026-11-24"},{"id":"b025","t":"BUSINESS","p":"Build contacts","m":"xây dựng mối quan hệ trong công việc","s":"Attending trade fairs helped him build valuable contacts in the industry. (Việc tham dự các hội chợ thương mại giúp anh ấy xây dựng được những mối quan hệ giá trị trong ngành.)","st":0,"d":"2026-11-24"},{"id":"b026","t":"BUSINESS","p":"do business","m":"trade, deal, work: làm ăn, kinh doanh","s":"Our company does business with partners in over 20 countries. (Công ty chúng tôi làm ăn với các đối tác ở hơn 20 quốc gia.)","st":0,"d":"2026-11-24"},{"id":"b027","t":"BUSINESS","p":"firm","m":"công ty (thường nhỏ hoặc vừa)","s":"a law / accounting / consulting / family firm, set up a firm, a firm of lawyers","st":0,"d":"2026-11-24"},{"id":"b028","t":"BUSINESS","p":"Vice President (VP)","m":"phó chủ n020","t":"BUSINESS","p":"Allocate","m":"(v) /ˈæləkeɪt/: phân bổ | Đồng nghĩa: assign, distribute, earmark | Cụm: budget allocation (phân bổ ngân sách), allocate resources / funds / time","s":"The manager allocated more time to staff training. → Quản lý phân bổ nhiều thời gian hơn cho việc đào tạo nhân viên.","st":0,"d":"2026-11-24"},{"id":"n021","t":"WORK","p":"Demanding","m":"(adj) /dɪˈmɑːndɪŋ/: đòi hỏi cao, vất vả | Đồng nghĩa: challenging, taxing, tough, exacting | Cụm: demanding job / boss / schedule / course","s":"Being a doctor is a demanding job. → Làm bác sĩ là một công việc đòi hỏi rất cao.","st":0,"d":"2026-11-24"},{"id":"n022","t":"WORK","p":"Incentivize","m":"(v) /ɪnˈsentɪvaɪz/ (Anh: incentivise): khuyến khích bằng ưu đãi | Đồng nghĩa: motivate, encourage, reward | Cụm: incentivise staff / employees / customers, an incentive (n)","s":"Companies often incentivise staff with annual bonuses. → Các công ty thường khuyến khích nhân viên bằng tiền thưởng cuối năm.","st":0,"d":"2026-11-24"},{"id":"n023","t":"BUSINESS","p":"Stake","m":"(n) /steɪk/: phần vốn góp, cổ phần; quyền lợi liên quan | Đồng nghĩa: share, interest, investment | Cụm: hold a 20% stake in, have a stake in sth, stakeholder (n)","s":"The investor bought a 15% stake in the start-up. → Nhà đầu tư mua 15% cổ phần của công ty khởi nghiệp.","st":0,"d":"2026-11-24"},{"id":"n024","t":"BUSINESS","p":"Revenue projection","m":"dự báo doanh thu | Đồng nghĩa: revenue forecast, sales forecast | Cụm: prepare / review a revenue projection, a five-year revenue projection","s":"The revenue projection shows strong growth next year. → Dự báo doanh thu cho thấy tăng trưởng mạnh vào năm tới.","st":0,"d":"2026-11-24"},{"id":"n025","t":"TRANSPORTATION","p":"Commuting costs","m":"chi phí đi lại hằng ngày để đi làm | Đồng nghĩa: travel costs, transport costs | Cụm: reduce / cut commuting costs, rising commuting costs","s":"Working from home helps employees save on commuting costs. → Làm việc ở nhà giúp nhân viên tiết kiệm chi phí đi lại.","st":0,"d":"2026-11-24"},{"id":"n026","t":"TRANSPORTATION","p":"Commute / travel long distances to…","m":"(v): đi làm quãng đường xa đến… | Đồng nghĩa: travel to work, make a long journey to work | Cụm: commute to work, commute from X to Y, a long commute (n)","s":"Many people commute long distances to the city centre every day. → Nhiều người đi một quãng đường xa vào trung tâm thành phố mỗi ngày.","st":0,"d":"2026-11-24"},{"id":"n027","t":"TRANSPORTATION","p":"Commuter","m":"(n) /kəˈmjuːtə(r)/: người đi làm xa hằng ngày | Đồng nghĩa: daily traveller | Cụm: commuter train / belt / traffic, rail commuters","s":"Thousands of commuters were delayed by the strike. → Hàng nghìn người đi làm bị chậm trễ vì cuộc đình công.","st":0,"d":"2026-11-24"},{"id":"n028","t":"WORK","p":"Craftsmanship","m":"(n) /ˈkrɑːftsmənʃɪp/: tay nghề, kỹ năng thủ công điêu luyện | Đồng nghĩa: skill, artistry, workmanship | Cụm: fine / excellent craftsmanship, traditional craftsmanship","s":"The furniture is known for its excellent craftsmanship. → Đồ nội thất này nổi tiếng nhờ tay nghề xuất sắc.","st":0,"d":"2026-11-24"},{"id":"n029","t":"BUSINESS","p":"Strategic location","m":"vị trí chiến lược | Đồng nghĩa: prime location, key position | Cụm: a strategic location for trade / business","s":"The port's strategic location makes it ideal for international trade. → Vị trí chiến lược của cảng khiến nó lý tưởng cho thương mại quốc tế.","st":0,"d":"2026-11-24"},{"id":"n030","t":"BUSINESS","p":"Value proposition","m":"đề xuất giá trị (lợi ích độc đáo mà sản phẩm mang lại cho khách) | Đồng nghĩa: unique selling point (USP), customer benefit | Cụm: a clear / strong value proposition, define your value proposition","s":"Our value proposition is high quality at an affordable price. → Đề xuất giá trị của chúng tôi là chất lượng cao với giá phải chăng.","st":0,"d":"2026-11-24"},{"id":"n031","t":"BUSINESS","p":"Operational side","m":"mặt vận hành (hoạt động hằng ngày) | Đồng nghĩa: operations, day-to-day running | Cụm: the operational side of the business","s":"She manages the operational side while her partner handles marketing. → Cô ấy quản lý mặt vận hành còn đối tác lo marketing.","st":0,"d":"2026-11-24"},{"id":"n032","t":"BUSINESS","p":"Development plan","m":"kế hoạch phát triển | Đồng nghĩa: growth plan, roadmap | Cụm: draw up / implement a development plan, a five-year development plan","s":"The company has a ten-year development plan. → Công ty có kế hoạch phát triển mười năm.","st":0,"d":"2026-11-24"},{"id":"n033","t":"BUSINESS","p":"Legacy","m":"(n) /ˈleɡəsi/: di sản, những gì để lại | Đồng nghĩa: heritage, inheritance, bequest | Cụm: leave a legacy, a lasting legacy, legacy system (hệ thống cũ còn dùng)","s":"The founder left a legacy of innovation. → Người sáng lập để lại di sản về sự đổi mới.","st":0,"d":"2026-11-24"},{"id":"n034","t":"BUSINESS","p":"Partnership","m":"(n) /ˈpɑːtnəʃɪp/: quan hệ đối tác, công ty hợp danh | Đồng nghĩa: alliance, collaboration, association | Cụm: form / enter into a partnership, in partnership with sb, business partnership","s":"The two firms formed a partnership to enter the Asian market. → Hai công ty lập quan hệ đối tác để vào thị trường châu Á.","st":0,"d":"2026-11-24"},{"id":"n035","t":"BUSINESS","p":"Scale","m":"(n, v) /skeɪl/: quy mô; mở rộng quy mô | Đồng nghĩa: size, extent; (v) expand, grow | Cụm: economies of scale (lợi thế quy mô), on a large scale, scale up / scale down","s":"The start-up plans to scale up production next year. → Công ty khởi nghiệp dự định nâng quy mô sản xuất vào năm tới.","st":0,"d":"2026-11-24"},{"id":"n036","t":"BUSINESS","p":"Financial year","m":"năm tài chính | Đồng nghĩa: fiscal year | Cụm: end of the financial year, in the last financial year","s":"The company's financial year ends in March. → Năm tài chính của công ty kết thúc vào tháng Ba.","st":0,"d":"2026-11-24"},{"id":"n037","t":"BUSINESS","p":"Institutional capital","m":"vốn từ các tổ chức đầu tư (quỹ hưu trí, quỹ đầu tư, ngân hàng...) | Đồng nghĩa: institutional investment, institutional funding | Cụm: attract / raise institutional capital, institutional investors","s":"The start-up raised institutional capital to expand overseas. → Công ty khởi nghiệp huy động vốn từ các tổ chức để mở rộng ra nước ngoài.","st":0,"d":"2026-11-24"},{"id":"n038","t":"WORK","p":"Course correct / course correction","m":"(v / n): điều chỉnh hướng đi khi thấy sai lệch | Đồng nghĩa: change direction, adjust, realign | Cụm: make a course correction, course correct early","s":"The company had to course correct after weak sales. → Công ty phải điều chỉnh hướng đi sau doanh số yếu.","st":0,"d":"2026-11-24"},{"id":"n039","t":"WORK","p":"Navigate tensions","m":"xử lý, vượt qua căng thẳng (trong công việc, quan hệ) | Đồng nghĩa: manage conflict, handle disagreements | Cụm: navigate tensions between teams / partners","s":"A good leader knows how to navigate tensions within the team. → Người lãnh đạo giỏi biết cách xử lý căng thẳng trong nhóm.","st":0,"d":"2026-11-24"},{"id":"n040","t":"WORK","p":"Drive the culture","m":"dẫn dắt, định hình văn hóa (tổ chức) | Đồng nghĩa: shape the culture, lead the culture | Cụm: drive culture change, drive a culture of + N","s":"Senior managers play a key role in driving the culture. → Quản lý cấp cao đóng vai trò then chốt trong việc định hình văn hóa.","st":0,"d":"2026-11-24"},{"id":"n041","t":"BUSINESS","p":"Deliver on the promise","m":"thực hiện đúng lời hứa, đáp ứng kỳ vọng | Đồng nghĩa: keep a promise, live up to expectations, fulfil a commitment | Cụm: deliver on a promise / commitment / expectations","s":"The brand has delivered on its promise of quality. → Thương hiệu đã thực hiện đúng lời hứa về chất lượng.","st":0,"d":"2026-11-24"},{"id":"n042","t":"BUSINESS","p":"Future-proof","m":"(adj, v): được thiết kế để vẫn hiệu quả trong tương lai | Đồng nghĩa: long-lasting, sustainable, adaptable | Cụm: future-proof your business / skills / technology","s":"Learning digital skills can future-proof your career. → Học kỹ năng số có thể bảo đảm cho sự nghiệp của bạn trong tương lai.","st":0,"d":"2026-11-24"},{"id":"n043","t":"BUSINESS","p":"At the forefront","m":"ở vị trí tiên phong | Đồng nghĩa: in the lead, leading the way, at the cutting edge | Cụm: at the forefront of research / innovation / technology","s":"The firm is at the forefront of renewable energy technology. → Công ty đứng đầu về công nghệ năng lượng tái tạo.","st":0,"d":"2026-11-24"},{"id":"n044","t":"BUSINESS","p":"Strategic","m":"(adj) /strəˈtiːdʒɪk/: mang tính chiến lược | Đồng nghĩa: calculated, planned, tactical | Cụm: strategic plan / decision / partnership / move","s":"The merger was a strategic decision to enter new markets. → Việc sáp nhập là quyết định chiến lược để vào thị trường mới.","st":0,"d":"2026-11-24"},{"id":"n045","t":"BUSINESS","p":"Vision","m":"(n) /ˈvɪʒn/: tầm nhìn | Đồng nghĩa: foresight, outlook, long-term goal | Cụm: have a vision, vision statement, a clear vision for the future","s":"The CEO shared her vision for the next decade. → Tổng giám đốc chia sẻ tầm nhìn cho thập kỷ tới.","st":0,"d":"2026-11-24"},{"id":"n046","t":"BUSINESS","p":"Alignment","m":"(n) /əˈlaɪnmənt/: sự đồng bộ, thống nhất (mục tiêu, hướng đi) | Đồng nghĩa: agreement, coordination, consistency | Cụm: in alignment with sth, alignment of goals / strategy","s":"We need better alignment between sales and marketing. → Chúng ta cần sự đồng bộ tốt hơn giữa bán hàng và marketing.","st":0,"d":"2026-11-24"},{"id":"n047","t":"BUSINESS","p":"Framework","m":"(n) /ˈfreɪmwɜːk/: khuôn khổ, khung lý thuyết hoặc quy trình | Đồng nghĩa: structure, system, model | Cụm: legal / conceptual / theoretical framework, provide a framework for","s":"The report sets out a framework for improving customer service. → Báo cáo đưa ra một khuôn khổ để cải thiện dịch vụ khách hàng.","st":0,"d":"2026-11-24"},{"id":"n048","t":"EDUCATION","p":"Systematic","m":"(adj) /ˌsɪstəˈmætɪk/: có hệ thống, bài bản | Đồng $('habg').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.d>today())return;habit[b.dataset.d]=!habit[b.dataset.d];save()};
function renderTest(){const box=$('tst');if(!tq){const last=tests.slice(-5).reverse().map(x=>`<span class='tag'>${x.d}: ${x.score}/${x.n}</span>`).join(' ');box.innerHTML=items.filter(i=>i.m).length<4?`<span class='mu'>Cần ít nhất 4 cụm (có nghĩa) trong sổ để làm test.</span>`:`<button class='btn' data-a='start'>Bắt đầu test (10 câu)</button><div class='mu' style='margin-top:6px'>Mỗi câu hiện nghĩa tiếng Việt. Hãy nói to cụm tiếng Anh trước, rồi chọn đáp án.</div>${last?`<div style='margin-top:6px'>Gần đây: ${last}</div>`:''}`;return}if(tq.i>=tq.q.length){box.innerHTML=`<b style='font-size:1.2rem'>Kết quả: ${tq.sc}/${tq.q.length}</b>${tq.miss.length?`<div style='margin-top:6px'>Cần gặp lại:${tq.miss.map(w=>`<div>• <b>${esc(w.p)}</b> · ${esc(w.m)}</div>`).join('')}</div><div class='bar'><button class='btn s' data-a='demote'>Đưa các cụm sai về 🌱</button></div>`:`<div>Đúng hết! 🎉</div>`}<div class='bar'><button class='btn' data-a='start'>Làm lại</button><button class='btn s' data-a='end'>Đóng</button></div>`;return}const w=tq.q[tq.i],ch=tq.opts[tq.i];box.innerHTML=`<div class='mu'>Câu ${tq.i+1}/${tq.q.length} · chủ đề ${esc(w.t)}</div><div style='font-size:1.15rem;margin:6px 0'><b>${esc(w.m)}</b></div><div class='mu'>Nói to cụm tiếng Anh trước, rồi chọn.</div><div class='opts'>${ch.map(o=>`<button class='btn s opt' data-a='ans' data-id='${o.id}'>${esc(o.p)}</button>`).join('')}</div><div id='fb'></div>`}
$('tst').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='start'){const q=items.filter(i=>i.m).sort(()=>Math.random()-.5).slice(0,10);tq={q,i:0,sc:0,miss:[],locked:false,opts:q.map(w=>[w,...items.filter(x=>x.id!==w.id&&x.p!==w.p).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5))};renderTest()}else if(a==='ans'){if(tq.locked)return;tq.locked=true;const w=tq.q[tq.i],ok=b.dataset.id===w.id;if(ok)tq.sc++;else tq.miss.push(w);document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.id===w.id){o.style.background='var(--g2)';o.style.color='#fff'}});if(!ok){b.style.background='#c92a2a';b.style.color='#fff'}$('fb').innerHTML=`<div style='margin-top:8px'>${ok?'✅ Đúng':'❌ Chưa đúng'}: <b>${esc(w.p)}</b>${w.s?`<br><i>“${esc(w.s)}”</i>`:''}</div><button class='btn' data-a='next' style='margin-top:8px'>${tq.i+1>=tq.q.length?'Xem kết quả':'Câu tiếp'}</button>`}else if(a==='next'){tq.locked=false;tq.i++;if(tq.i>=tq.q.length){tests.push({d:today(),score:tq.sc,n:tq.q.length});tests=tests.slice(-30);save()}renderTest()}else if(a==='demote'){tq.miss.forEach(w=>{const x=items.find(i=>i.id===w.id);if(x)x.st=0});save();b.textContent='Đã đưa về 🌱';b.disabled=true}else if(a==='end'){tq=null;renderTest()}};
function streak(){const ds=new Set(items.map(i=>i.d));let n=0,d=new Date();if(!ds.has(day(d)))d.setDate(d.getDate()-1);while(ds.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function ring(p,c){const r=34,L=2*Math.PI*r;return `<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--ln)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L*p} ${L}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="var(--tx)">${Math.round(p*100)}%</text></svg>`}
function render(){
 const tps=[...new Set(items.map(i=>i.t))];
 $("k1").textContent=items.length;$("k2").textContent=items.filter(i=>i.st==2).length;$("k3").textContent=tps.length;$("tcnt").textContent=tps.length?"· "+tps.length+" chủ đề · bấm để lọc":"";$("k4").textContent=streak();{const n=items.length||1,u=items.filter(i=>i.st==2).length,h=items.filter(i=>i.st==1).length;$("pg").style.width=u/n*100+"%";$("pg2").style.width=h/n*100+"%";$("pgt").textContent="🌳 "+u+" · 🌿 "+h+" · 🌱 "+(items.length-u-h)+" — "+Math.round(u/n*100)+"% đã dùng được khi nói"}document.querySelectorAll("#lv button").forEach(b=>b.classList.toggle("on",+b.dataset.lv===lvf));
 $("tl").innerHTML=tps.map(t=>`<option value="${esc(t)}">`).join("");
 $('tchips').innerHTML=tps.map(t=>`<button class='btn s ${filter===t?'chipon':''}' data-t='${esc(t)}'>${esc(t)} · ${items.filter(i=>i.t===t).length}</button>`).join('');document.querySelectorAll('#tchips button').forEach(b=>b.onclick=()=>{filter=b.dataset.t;render()});
 $("topics").innerHTML=tps.length?[...tps].map(t=>({t,a:items.filter(i=>i.t===t)})).sort((x,y)=>y.a.length-x.a.length).map(({t,a})=>`<div class="tp ${filter===t?"on":""}" data-t="${esc(t)}"><b>${esc(t)}</b><em>${a.length} cụm · ${a.filter(i=>i.st==2).length}🌳</em><i style="--p:${Math.round(a.filter(i=>i.st==2).length/a.length*100)}%"></i></div>`).join(""):`<span class="mu">Chưa có chủ đề nào.</span>`;
 document.querySelectorAll(".tp").forEach(e=>e.onclick=()=>{filter=e.dataset.t;render()});
 const cnt={};items.forEach(i=>cnt[i.d]=(cnt[i.d]||0)+1);renderExtras(cnt);
 
 
 const old=items.filter(i=>i.st<2).sort(()=>Math.random()-.5).slice(0,4);
 $("rv").innerHTML=old.length?old.map(i=>`<div class="r"><b>${esc(i.p)}</b> <span class="mu">· ${esc(i.m)}</span>${i.s?`<br><i>“${esc(i.s)}”</i>`:""}</div>`).join("")+`<div class="mu" style="margin-top:6px">Đọc to 2 lần, rồi nói một câu mới về cuộc sống của bạn dùng cụm đó. Dùng xong thì bấm cây trong sổ để lên 🌿/🌳.</div>`:`<span class="mu">Mọi cụm đã lên 🌳, hoặc sổ đang trống. Thêm từ mới nhé.</span>`;
 const q=$("q").value.toLowerCase(),L=items.filter(i=>(!filter||i.t===filter)&&(lvf<0||i.st===lvf)&&(!q||(i.p+i.m+i.s).toLowerCase().includes(q)));
 $("flt").textContent="· "+L.length+" cụm"+(filter?" · "+filter:"");
 $("list").innerHTML=L.length?L.map(i=>`<div class="item"><button class="pl" data-id="${i.id}" title="Đổi mức">${["🌱","🌿","🌳"][i.st]}</button><div><b>${esc(i.p)}</b> <span class="tag">${esc(i.t)}</span><br>${esc(i.m)}${i.s?`<br><i>“${esc(i.s)}”</i>`:""}</div><button class="btn s" data-del="${i.id}" title="Xóa">✕</button></div>`).join(""):`<span class="mu">Không có kết quả.</span>`;
 document.querySelectorAll(".pl").forEach(b=>b.onclick=()=>{const i=items.find(x=>x.id===b.dataset.id);i.st=(i.st+1)%3;save()});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Xóa cụm này?")){items=items.filter(x=>x.id!==b.dataset.del);save()}});
}
render();init();
</script></body></html>
